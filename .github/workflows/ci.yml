name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Tests stub mediapipe via sys.modules and patch joblib.load, so no webcam
      # or model files are needed. If a libGL import error ever surfaces from a
      # transitive dep, uncomment:
      #   sudo apt-get update && sudo apt-get install -y libgl1
      - name: Run pytest with coverage
        run: pytest --cov=main --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/asl-web
    env:
      # Placeholder so the Next.js build doesn't fail on a missing env var.
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/asl-web/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validates the backend Dockerfile compiles. No push.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: asl-hangman-api:ci

  # ---------------------------------------------------------------------------
  # Future: Elastic Beanstalk deploy job would attach here, gated on
  # `if: github.ref == 'refs/heads/main' && github.event_name == 'push'` and
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in repo secrets. Currently
  # disabled because RDS + EB are torn down. See README for details.
  # ---------------------------------------------------------------------------
